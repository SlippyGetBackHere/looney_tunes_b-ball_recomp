[General]
# Automatically save state on quit and reload on start
Autosave = 0

# Disable the SDL_Delay that happens each frame (slightly better
# perf if your display is set to exactly 60hz)
DisableFrameDelay = 0

SkipLauncher = 0
RunAhead = 0
[Graphics]
# Window size (Auto or WidthxHeight)
WindowSize = Auto

# Fullscreen mode (0=windowed, 1=desktop fullscreen, 2=fullscreen w/mode change)
Fullscreen = 0

# Window scale (1=100%, 2=200%, 3=300%, etc.)
WindowScale = 3

# Use the optimized SNES PPU implementation
NewRenderer = 1

# Don't keep the aspect ratio
IgnoreAspectRatio = 0

# Remove the sprite limits per scan line
NoSpriteLimits = 1

DisplayAspect = 4:3
OutputMethod = SDL
LinearFiltering = 0
Shader = 
Widescreen = 0
FrameBlend = 0
VSync = adaptive
Renderer = auto
[Sound]
EnableAudio = 1
# 0..100; VolumeUp / VolumeDown move it in 5% steps and show a bar.
Volume = 100
AudioFreq = 32000
AudioChannels = 2
AudioSamples = 512

[KeyMap]
# This section is for system-level shortcuts (save/load state,
# fullscreen, pause, etc.). The 12 SNES controller buttons live
# in keybinds.ini next to the executable.
Fullscreen = Alt+Return
Reset = Ctrl+r
Pause = Shift+p
PauseDimmed = p
Turbo = Tab
WindowBigger = Ctrl+Up
WindowSmaller = Ctrl+Down
VolumeUp = Keypad +
VolumeDown = Keypad -
DisplayPerf = f
ToggleRenderer = r
SaveStateMenu = F11
Rewind = F12
Load =      F1,     F2,     F3,     F4,     F5,     F6,     F7,     F8,     F9,     F10
Save = Shift+F1,Shift+F2,Shift+F3,Shift+F4,Shift+F5,Shift+F6,Shift+F7,Shift+F8,Shift+F9,Shift+F10

[GamepadMap]
# Enable each player's gamepad slot. SDL_GameController-compatible
# controllers (Xbox, PlayStation, Switch Pro, etc.) auto-detect
# when plugged in. Set to false to force keyboard-only.
EnableGamepad1 = true
EnableGamepad2 = false

# Default Xbox-layout mapping. Order matches kKeys_Controls:
#   Up, Down, Left, Right, Select, Start, A, B, X, Y, L, R
# Edit + restart to rebind. Shoulder = L1/Lb (top), trigger = L2.
Controls =   DpadUp, DpadDown, DpadLeft, DpadRight, Back, Start, B, A, Y, X, Lb, Rb
ControlsP2 = DpadUp, DpadDown, DpadLeft, DpadRight, Back, Start, B, A, Y, X, Lb, Rb

GamepadDeadzone = 3277
[Controller]
SourceP1 = 2
SourceP2 = 0
GuidP1 = 0300fa675e040000ff02000000007801

[Netplay]
PlayerName = 

