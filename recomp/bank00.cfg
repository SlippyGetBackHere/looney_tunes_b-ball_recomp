# Looney Tunes B-Ball (USA) — LLE-first seed
# Regenerate with tools/regen.sh. Promote functions by editing recomp/symbols.toml
# and re-running the regen script, which rewrites the block below.
bank = 0
auto_vectors
tier_down_stubs

# Reset vector $b630, native NMI $b43b (from the cartridge header).

# Sprite emitter (builds the OAM shadow at $1200/$1400). Replaced by a helper
# that runs the original -- its first instruction itself, then the compiled
# body from $C3C3 -- and, in widescreen court play only, appends the sprites
# the original culled at the native edge that lie in the margins
# (src/ltbb_oam_widen.c, docs/WIDESCREEN.md P7/P8).
func LtbbOamEmitBody c3c3 entry_mx:0,0
hle_func c3c0 HleLtbbOamEmit

# >>> BEGIN symbols.toml (generated — do not edit)
symbol 00b43b I_NMI
force_lle 00b43b
symbol 00b630 I_RESET
force_lle 00b630
# <<< END symbols.toml
