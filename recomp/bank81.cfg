# Looney Tunes B-Ball (USA) -- bank $81.
#
# Entry point for the "Change tournament difficulty" mod
# (src/mod_tournament_difficulty.c). $81:FF60 is in the unused $FF padding at
# the end of the bank; no game code reaches it. While the mod is on, it
# points the menu input handler's three calls to the menu refresh
# (JSR $CB35 at $81:C722, $C74B, $C894 -- interpreted code, which reads the
# cartridge buffer) here instead. The helper hides the tournament flag ($1165)
# from the refresh, so it no longer forces the difficulty to 5, and calls the
# refresh itself. With the mod off the calls are untouched and nothing here
# is reached.
bank = 81

hle_func ff60 HleLtbbMenuRefresh
