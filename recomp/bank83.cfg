# Looney Tunes B-Ball (USA) -- bank $83: graphics decompressor ($83:FA89).
#
# Its copy commands jump into the middle of unrolled copy loops through a
# direct-page pointer: JMP ($006E) after loading $6E from a table indexed by
# the command byte, and JMP ($006C) back to the command loop, where $6C holds
# one of the immediates the decompressor stores ($83:FACE/FAD5/FC05/FC0C).
# Unresolved, every command handed the rest of the decompression to a nested
# interpreter run that never checks the frame deadline, so a portrait upload
# on character select ran ~70 lines past vblank and NMI landed mid-screen
# (HDMAEN rewritten at line 36: black squares over the team slots).
# Targets are read from the ROM tables named below; any other runtime value
# still falls back to the interpreter.
bank = 83

indirect_dispatch fb10 4 ptrtail targets:fadc,fae5,fc13,fc23
indirect_dispatch fb99 4 ptrtail targets:fadc,fae5,fc13,fc23
indirect_dispatch fc60 4 ptrtail targets:fadc,fae5,fc13,fc23
indirect_dispatch fcf6 4 ptrtail targets:fadc,fae5,fc13,fc23
indirect_dispatch fd59 4 ptrtail targets:fadc,fae5,fc13,fc23
indirect_dispatch fdc8 4 ptrtail targets:fadc,fae5,fc13,fc23
indirect_dispatch fdfe 4 ptrtail targets:fadc,fae5,fc13,fc23
indirect_dispatch fe64 4 ptrtail targets:fadc,fae5,fc13,fc23

# JMP ($006E): table $83:FE67,X  X=(A&$78)>>2
indirect_dispatch fb3a 16 ptrtail targets:fd4d,fdbc,fd47,fdb6,fd41,fdb0,fd3b,fdaa,fd35,fda4,fd2f,fd9e,fd29,fd98,fd23,fd92
# JMP ($006E): table $83:FEA5,X  X=(A&$1F)<<1, A!=0
indirect_dispatch fbc4 31 ptrtail targets:fdf8,fe5e,fdf5,fe5b,fdf2,fe58,fdef,fe55,fdec,fe52,fde9,fe4f,fde6,fe4c,fde3,fe49,fde0,fe46,fddd,fe43,fdda,fe40,fdd7,fe3d,fdd4,fe3a,fdd1,fe37,fdce,fe34,fdcb
# JMP ($006E): table $83:FE87,X  X=(A&$78)>>2
indirect_dispatch fca1 16 ptrtail targets:fdb6,fdb0,fdaa,fda4,fd9e,fd98,fd92,fd8c,fd86,fd80,fd7a,fd74,fd6e,fd68,fd62,fd5c
# JMP ($006E): table $83:FEE3,X  X=(A&$1F)<<1, A!=0
indirect_dispatch fd1b 31 ptrtail targets:fe5b,fe58,fe55,fe52,fe4f,fe4c,fe49,fe46,fe43,fe40,fe3d,fe3a,fe37,fe34,fe31,fe2e,fe2b,fe28,fe25,fe22,fe1f,fe1c,fe19,fe16,fe13,fe10,fe0d,fe0a,fe07,fe04,fe01

# Exit widths of the decompressor. The jump targets above leave it
# interpreter-only: the shared copy-loop exits ($FDC8, $FE64) are reached by
# both variants, so the analyzer also sends variant B's 8-bit exit to variant
# A's $FAE5, decodes BIT #$0080 as BIT #$80 and stops at a phantom BRK at
# $FAE9. On hardware the value in $6C pairs each exit with its own variant.
# Its callers ($82:FC9E, $82:FCB3 and ~30 more) need only its exit widths.
# Traced from entry M=0/X=0 with $6C followed per path and the tables above:
# all four exits (RTL at $FAE4, $FBCB, $FC22, $FD22) return M=0/X=0
# (PLB/SEC/RTL after the entry PHB), with no calls out, no BRK and no
# unbalanced PLP.
#
# Compiled callers run the decompressor as a nested interpreter run, which
# must stop at the frame deadline or a long decompression crosses vblank and
# NMI lands mid-screen (the character-select flash). That needs
# patches/snesrecomp-nested-deadline-yield.patch.
exit_mx_variant 83fa89 0 0 0 0
exit_mx_variant 03fa89 0 0 0 0

# Entry point for the "CPU doesn't steal" mod (src/mod_cpu_no_steal.c).
# $83:FF40 is in the unused $FF padding at the end of the bank; no game code
# reaches it. While the mod is on, it points the per-frame update's call to
# the player logic (JSL $82:B91D at $83:F3AE -- interpreted code, which reads
# the cartridge buffer) here instead. The helper clears the steal button
# from the CPU defenders' virtual input, then runs $82:B91D. With the mod off
# the call is untouched and nothing here is reached.
hle_func ff40 HleLtbbPlayerLogic
